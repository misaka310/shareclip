name: Package Windows EXE

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shareclip-windows-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Package and verify ShareClip (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and package the Windows EXE
        run: npm run dist

      - name: Verify EXE and write immutable receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'release/ShareClip-win32-x64/ShareClip.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "ShareClip executable missing: $exe"
          }
          $file = Get-Item -LiteralPath $exe
          if ($file.Length -le 0) { throw "ShareClip executable is empty" }
          $locked = node -p "require('./package-lock.json').packages['node_modules/electron'].version"
          $installed = node -p "require('./node_modules/electron/package.json').version"
          if ($locked -ne $installed) {
            throw "Electron installed version does not match the lockfile"
          }
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          @(
            "source_commit=$env:GITHUB_SHA"
            "electron=$installed"
            "executable=ShareClip-win32-x64/ShareClip.exe"
            "sha256=$digest"
            "bytes=$($file.Length)"
          ) | Set-Content -LiteralPath 'release/build-receipt.txt' -Encoding utf8
          Get-Content -LiteralPath 'release/build-receipt.txt'

      - name: Retain unsigned Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shareclip-windows-x64-${{ github.sha }}
          path: |
            release/ShareClip-win32-x64/
            release/build-receipt.txt
          if-no-files-found: error
          retention-days: 14
